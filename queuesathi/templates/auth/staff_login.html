{% extends "base.html" %}

{% block title %}{{ service['service_name'] }} Staff Login | QueueSathi{% endblock %}

{% block content %}

<div class="auth-narrow">

    <section class="card auth-card">

        <div class="auth-header">
            <span class="hero-badge">Staff · {{ service['service_code'] }}</span>
            <h1>{{ service['service_name'] }}</h1>
            <p>Sign in with your department account.</p>
        </div>

        <form method="POST">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="username">Staff username</label>
            <input id="username"
                   type="text"
                   name="username"
                   autocomplete="username"
                   required>

            <label for="password">Password</label>
            <input id="password"
                   type="password"
                   name="password"
                   autocomplete="current-password"
                   required>

            <button type="submit" class="btn btn-primary auth-button">
                Login to dashboard
            </button>

        </form>

        <p class="auth-footer">
            <a href="{{ url_for('auth.staff_select') }}">← Choose another department</a>
        </p>

    </section>

</div>

{% endblock %}
