{% extends "base.html" %}

{% block title %}Create Account | QueueSathi{% endblock %}

{% block content %}

<div class="auth-narrow">

    <section class="card auth-card">

        <div class="auth-header">
            <span class="hero-badge">New student</span>
            <h1>Create your account</h1>
            <p>Register to generate and track queue tokens.</p>
        </div>

        <form method="POST">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="username">Username</label>
            <input id="username"
                   type="text"
                   name="username"
                   minlength="3"
                   autocomplete="username"
                   required>

            <label for="password">Password</label>
            <input id="password"
                   type="password"
                   name="password"
                   minlength="8"
                   autocomplete="new-password"
                   aria-describedby="password-hint"
                   required>
            <p id="password-hint" class="field-hint">At least 8 characters.</p>

            <label for="confirm_password">Confirm password</label>
            <input id="confirm_password"
                   type="password"
                   name="confirm_password"
                   minlength="8"
                   autocomplete="new-password"
                   required>

            <button type="submit" class="btn btn-primary auth-button">
                Create account
            </button>

        </form>

        <p class="auth-footer">
            Already registered?
            <a href="{{ url_for('auth.student_login') }}">Login</a>
        </p>

    </section>

</div>

{% endblock %}
