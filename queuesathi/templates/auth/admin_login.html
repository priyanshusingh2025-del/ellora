{% extends "base.html" %}

{% block title %}Administrator Login | QueueSathi{% endblock %}

{% block content %}

<div class="auth-narrow">

    <section class="card auth-card">

        <div class="auth-header">
            <span class="hero-badge hero-danger">Restricted area</span>
            <h1>Administrator</h1>
            <p>Authorized administrators only.</p>
        </div>

        <form method="POST">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="username">Admin username</label>
            <input id="username"
                   type="text"
                   name="username"
                   autocomplete="username"
                   required>

            <label for="password">Password</label>
            <input id="password"
                   type="password"
                   name="password"
                   autocomplete="current-password"
                   required>

            <button type="submit" class="btn btn-primary auth-button">
                Admin login
            </button>

        </form>

    </section>

</div>

{% endblock %}
